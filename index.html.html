<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cacao Alchemist: Fermentasi &amp; Belahan Biji Virtual (Cut Test)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

  :root {
    --w1: #965a2b;
    --w2: #47250d;
    --w-border: #261104;
    --gold: #ffcf40;
    --cream: #fff8eb;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(92, 168, 56, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(255, 196, 64, 0.14) 0%, transparent 50%),
      radial-gradient(ellipse at center, #1d3611 0%, #0b1606 100%);
    color: #ffffff;
  }

  h1, h2, h3, h4, .font-title {
    font-family: 'Fredoka', sans-serif;
  }

  /* Kontainer Panggung Diorama Utama */
  #app {
    position: relative;
    isolation: isolate;
    box-shadow:
      0 28px 65px rgba(0, 0, 0, 0.78),
      0 10px 0 #1f0e03,
      inset 0 2px 1px rgba(255, 255, 255, 0.35),
      inset 0 -4px 14px rgba(0, 0, 0, 0.45);
    transition: background 0.6s ease;
  }

  /* Lapisan Partikel Cahaya Hangat / Serbuk Sari Melayang (Ambient Floating Particles) */
  #app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle at 12% 24%, rgba(255, 244, 184, 0.45) 0 2.5px, transparent 3.5px),
      radial-gradient(circle at 28% 76%, rgba(255, 232, 145, 0.35) 0 2px, transparent 3px),
      radial-gradient(circle at 46% 18%, rgba(255, 255, 255, 0.42) 0 2px, transparent 3px),
      radial-gradient(circle at 67% 64%, rgba(255, 224, 130, 0.38) 0 3px, transparent 4px),
      radial-gradient(circle at 84% 28%, rgba(255, 248, 200, 0.48) 0 2.2px, transparent 3.2px),
      radial-gradient(circle at 91% 82%, rgba(255, 214, 102, 0.32) 0 2.5px, transparent 3.5px),
      radial-gradient(circle at 54% 48%, rgba(255, 250, 220, 0.3) 0 1.8px, transparent 2.8px);
    background-size: 420px 360px;
    animation: ambientFloat 16s linear infinite;
  }

  /* Vignette & Pencahayaan Ruangan Berlapis */
  #app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 248, 220, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse at center, transparent 58%, rgba(12, 6, 2, 0.42) 100%);
  }

  #screen {
    position: relative;
    z-index: 1;
  }

  @keyframes ambientFloat {
    0% {
      transform: translateY(0px) translateX(0px);
      opacity: 0.72;
    }
    50% {
      transform: translateY(-18px) translateX(10px);
      opacity: 1;
    }
    100% {
      transform: translateY(-36px) translateX(0px);
      opacity: 0.72;
    }
  }

  /* Latar Belakang Pemandangan dengan Pencahayaan Berlapis */
  .bg-tropical {
    background:
      radial-gradient(circle at 82% 14%, rgba(255, 251, 205, 0.85) 0%, rgba(255, 236, 153, 0.25) 14%, transparent 34%),
      radial-gradient(ellipse at 50% 34%, rgba(255, 255, 255, 0.28) 0%, transparent 60%),
      linear-gradient(180deg, #47b5ff 0%, #a8e2ff 34%, #5aa641 34%, #387324 68%, #1c3d10 100%);
  }
  .bg-shed {
    background:
      radial-gradient(circle at 50% 8%, rgba(255, 235, 185, 0.45) 0%, transparent 48%),
      repeating-linear-gradient(90deg, rgba(40, 18, 4, 0.06) 0px, rgba(40, 18, 4, 0.06) 2px, transparent 2px, transparent 48px),
      radial-gradient(circle at 50% 24%, #ebd09e 0%, #9e6b36 58%, #47280e 100%);
  }
  .bg-lab {
    background:
      radial-gradient(circle at 50% 6%, rgba(255, 252, 240, 0.65) 0%, transparent 50%),
      radial-gradient(circle at 20% 30%, rgba(255, 238, 200, 0.28) 0%, transparent 45%),
      radial-gradient(circle at 50% 25%, #fbf1df 0%, #cfa97a 65%, #694420 100%);
  }

  /* Panel Kayu 3D & Perkamen dengan Kedalaman Realistis */
  .wood-panel {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255, 224, 175, 0.14) 0%, transparent 28%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 7px),
      linear-gradient(180deg, var(--w1), var(--w2));
    border: 3px solid var(--w-border);
    border-radius: 16px;
    box-shadow:
      0 7px 0 #1a0b02,
      0 14px 24px rgba(0, 0, 0, 0.45),
      inset 0 2px 1px rgba(255, 238, 198, 0.34),
      inset 0 -3px 6px rgba(15, 6, 1, 0.55);
  }

  .parchment {
    position: relative;
    background:
      radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.65) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(217, 179, 130, 0.28) 0%, transparent 50%),
      linear-gradient(180deg, #fffef9 0%, #f5e2c3 100%);
    color: #3b1e08;
    border: 3px solid #5e3616;
    border-radius: 16px;
    box-shadow:
      0 7px 0 #2b1506,
      0 15px 28px rgba(0, 0, 0, 0.36),
      inset 0 2px 2px rgba(255, 255, 255, 0.9),
      inset 0 -4px 12px rgba(138, 86, 38, 0.18);
  }

  .cut-board {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255, 224, 180, 0.16) 0%, transparent 18%),
      repeating-linear-gradient(90deg, #ae703e 0px, #ae703e 36px, #875026 36px, #875026 39px);
    border: 4px solid #381c08;
    border-radius: 18px;
    box-shadow:
      inset 0 5px 14px rgba(0, 0, 0, 0.48),
      inset 0 -3px 8px rgba(255, 215, 160, 0.15),
      0 8px 0 #210f03,
      0 16px 28px rgba(0, 0, 0, 0.45);
  }

  /* Tombol 3D Taktil dengan Kilau Cahaya Melintas (Sheen Sweep) */
  .btn-3d {
    position: relative;
    overflow: hidden;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, box-shadow 0.15s ease;
    border-radius: 9999px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-3d::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -75%;
    width: 50%;
    height: 200%;
    background: linear-gradient(
      105deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.42) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(18deg);
    transition: left 0.55s ease;
    pointer-events: none;
  }
  .btn-3d:hover:not(:disabled)::after {
    left: 135%;
  }
  .btn-3d:hover:not(:disabled) {
    filter: brightness(1.07);
    transform: translateY(-2px);
  }
  .btn-3d:active:not(:disabled) {
    transform: translateY(4px) scale(0.985);
  }
  .btn-3d:disabled {
    opacity: 0.52;
    cursor: not-allowed;
  }

  .btn-green {
    background: linear-gradient(180deg, #6ee657 0%, #248524 100%);
    border: 2.5px solid #124712;
    box-shadow: 0 5px 0 #0e360e, 0 8px 14px rgba(0, 0, 0, 0.3), inset 0 2px 1px rgba(255,255,255,0.45);
    color: #fff;
    text-shadow: 0 1.5px 0 rgba(0,0,0,0.45);
  }
  .btn-green:active:not(:disabled) {
    box-shadow: 0 1px 0 #0e360e, inset 0 2px 4px rgba(0,0,0,0.35);
  }

  .btn-gold {
    background: linear-gradient(180deg, #ffe77a 0%, #de9309 100%);
    border: 2.5px solid #6b4400;
    box-shadow: 0 5px 0 #4a2f00, 0 8px 14px rgba(0, 0, 0, 0.3), inset 0 2px 1px rgba(255,255,255,0.6);
    color: #422005;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  .btn-gold:active:not(:disabled) {
    box-shadow: 0 1px 0 #4a2f00, inset 0 2px 4px rgba(0,0,0,0.25);
  }

  .btn-blue {
    background: linear-gradient(180deg, #63bdff 0%, #1a64c7 100%);
    border: 2.5px solid #0c3570;
    box-shadow: 0 5px 0 #08224a, 0 8px 14px rgba(0, 0, 0, 0.3), inset 0 2px 1px rgba(255,255,255,0.45);
    color: #fff;
    text-shadow: 0 1.5px 0 rgba(0,0,0,0.4);
  }
  .btn-blue:active:not(:disabled) {
    box-shadow: 0 1px 0 #08224a, inset 0 2px 4px rgba(0,0,0,0.35);
  }

  .btn-wood {
    background: linear-gradient(180deg, #a66532 0%, #522a0e 100%);
    border: 2.5px solid #241003;
    box-shadow: 0 5px 0 #170901, 0 8px 14px rgba(0, 0, 0, 0.32), inset 0 2px 1px rgba(255,235,195,0.28);
    color: #ffe8a3;
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }
  .btn-wood:active:not(:disabled) {
    box-shadow: 0 1px 0 #170901, inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .btn-red {
    background: linear-gradient(180deg, #ff7575 0%, #c42323 100%);
    border: 2.5px solid #610d0d;
    box-shadow: 0 5px 0 #450909, 0 8px 16px rgba(185, 28, 28, 0.38), inset 0 2px 1px rgba(255,255,255,0.45);
    color: #fff;
    text-shadow: 0 1.5px 0 rgba(0,0,0,0.45);
  }
  .btn-red:active:not(:disabled) {
    box-shadow: 0 1px 0 #450909, inset 0 2px 4px rgba(0,0,0,0.4);
  }

  /* Kartu Interaktif dengan Efek Lift 3D */
  .card-lift {
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .card-lift:hover {
    transform: translateY(-4px) scale(1.025);
    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.32);
  }

  /* Transisi Masuk Antar-Layar yang Mulus */
  @keyframes screenFadeSlide {
    0% {
      opacity: 0;
      transform: translateY(8px) scale(0.992);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  .screen-enter {
    animation: screenFadeSlide 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Animasi Karakter Petani Kakao Hidup (Idle Breathing & Kaca Pembesar) */
  @keyframes farmerFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(0.8deg); }
  }
  @keyframes lensGlint {
    0%, 70%, 100% { opacity: 0.25; transform: translate(0, 0); }
    85% { opacity: 0.85; transform: translate(4px, -3px); }
  }
  .farmer-idle {
    transform-origin: 100px 180px;
    animation: farmerFloat 3.6s ease-in-out infinite;
  }
  .lens-glint {
    animation: lensGlint 3.6s ease-in-out infinite;
  }

  /* Animasi Uap, Gelombang Panas & Denyut Suhu Kotak Fermentasi */
  @keyframes steamRise {
    0% { transform: translateY(2px) scale(0.85); opacity: 0; }
    25% { opacity: 0.88; }
    100% { transform: translateY(-28px) scale(1.3); opacity: 0; }
  }
  .steam { animation: steamRise 2.2s infinite ease-out; }
  .steam-2 { animation: steamRise 2.5s infinite ease-out 0.85s; }
  .steam-3 { animation: steamRise 2.35s infinite ease-out 1.45s; }

  @keyframes heatGlow {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 0.48; }
  }
  .heat-aura {
    animation: heatGlow 2.4s ease-in-out infinite;
  }

  /* Animasi Gerakan Bilah & Gagang Guillotine Turun Membelah */
  @keyframes guillotineChop {
    0% { transform: translateY(0px); }
    32% { transform: translateY(58px); }
    48% { transform: translateY(54px); }
    85% { transform: translateY(8px); }
    100% { transform: translateY(0px); }
  }
  .guillotine-chopping {
    animation: guillotineChop 0.65s cubic-bezier(0.25, 1, 0.35, 1) forwards;
  }

  /* Getaran Halus Meja Saat Bilah Menghantam Landasan */
  @keyframes boardImpactShake {
    0%, 28% { transform: translate(0, 0); }
    33% { transform: translate(0, 3px); }
    39% { transform: translate(-2px, -1px); }
    45% { transform: translate(2px, 1px); }
    52% { transform: translate(0, 0); }
    100% { transform: translate(0, 0); }
  }
  .board-shake {
    animation: boardImpactShake 0.65s ease-out forwards;
  }

  /* Animasi Kilatan Potongan & Percikan Partikel Cahaya */
  @keyframes slashFlash {
    0%, 24% { opacity: 0; transform: scale(0.6); }
    36% { opacity: 1; transform: scale(1.22); }
    75% { opacity: 0.88; transform: scale(1.0); }
    100% { opacity: 0; transform: scale(0.9); }
  }
  .slash-flash-anim {
    transform-origin: 200px 145px;
    animation: slashFlash 0.65s ease-out forwards;
  }

  @keyframes sparkBurstLeft {
    0%, 28% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    42% { opacity: 1; transform: translate(-26px, -16px) scale(1.15); }
    100% { opacity: 0; transform: translate(-42px, -6px) scale(0.3); }
  }
  @keyframes sparkBurstRight {
    0%, 28% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    42% { opacity: 1; transform: translate(26px, -16px) scale(1.15); }
    100% { opacity: 0; transform: translate(42px, -6px) scale(0.3); }
  }
  .spark-left { animation: sparkBurstLeft 0.65s ease-out forwards; }
  .spark-right { animation: sparkBurstRight 0.65s ease-out forwards; }

  /* Animasi Belahan Keping Biji Membuka */
  @keyframes leftHalfOpen {
    0%, 30% { transform: translate(0px, 0px) rotate(0deg); }
    55% { transform: translate(-24px, -4px) rotate(-10deg); }
    100% { transform: translate(-20px, 0px) rotate(-6deg); }
  }
  @keyframes rightHalfOpen {
    0%, 30% { transform: translate(0px, 0px) rotate(0deg); }
    55% { transform: translate(24px, -4px) rotate(10deg); }
    100% { transform: translate(20px, 0px) rotate(6deg); }
  }
  .half-left-anim {
    transform-origin: 185px 154px;
    animation: leftHalfOpen 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .half-right-anim {
    transform-origin: 215px 154px;
    animation: rightHalfOpen 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popSplit {
    0% { transform: scale(0.82); }
    65% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }
  .split-anim {
    animation: popSplit 0.38s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes modalPopIn {
    0% { transform: scale(0.86) translateY(16px); opacity: 0; }
    65% { transform: scale(1.02) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-animate {
    animation: modalPopIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  /* Animasi Buka-Tutup Panel Detail & Contoh Materi Belajar */
  @keyframes accordionReveal {
    0% {
      opacity: 0;
      transform: translateY(-6px) scale(0.985);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  .accordion-open {
    animation: accordionReveal 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .study-clickable {
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  }
  .study-clickable:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 18px rgba(45, 22, 6, 0.18);
  }
  .study-clickable:active {
    transform: translateY(0px) scale(0.992);
  }
</style>
</head>
<body class="p-2 sm:p-4 pb-16 sm:pb-16 flex items-center justify-center">

  <main id="app" class="w-full max-w-[1140px] rounded-2xl overflow-hidden shadow-2xl border-4 border-[#361c08] bg-tropical flex flex-col justify-between min-h-[640px]">

    <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 text-yellow-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <div id="info-modal-box" class="parchment modal-animate w-full max-w-md overflow-hidden relative shadow-[0_24px_50px_rgba(0,0,0,0.75),0_8px_0_#2b1506] border-4 border-[#361c08]">
      <!-- Header Modal Bertema Kayu 3D -->
      <div class="wood-panel !rounded-none !border-x-0 !border-t-0 !shadow-none px-5 py-3.5 flex items-center justify-between gap-3">

              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>

          </div>
          <h2 id="info-modal-title" class="text-base sm:text-lg font-extrabold text-yellow-300 leading-tight drop-shadow-[0_2px_0_rgba(0,0,0,0.5)]">

        <button id="btn-close-modal-x" aria-label="Tutup Jendela Informasi" class="w-8 h-8 rounded-full bg-black/35 hover:bg-black/60 text-amber-200 hover:text-white flex items-center justify-center font-extrabold text-sm border border-amber-600/50 transition-colors cursor-pointer">

      </div>

      <!-- Konten Detail Informasi Aplikasi -->
      <div class="p-5 space-y-3.5 text-xs sm:text-sm">
        <div class="bg-white/90 rounded-xl p-3.5 border-2 border-amber-900/25 shadow-sm">
          <div class="text-[11px] uppercase tracking-wider font-extrabold text-amber-800">🍫 Nama Aplikasi</div>

        <div class="grid grid-cols-1 gap-2.5">

            Tutup

      </div>
    </div>
  </div>

// EFEK SUARA MEKANIK PISAU GUILLOTINE (WEB AUDIO API TANPA URL EKSTERNAL)
// ============================================================================
function playGuillotineSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    // Bunyi gesekan logam bilah meluncur turun
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.17);

    // Bunyi benturan "KLAK!" pada landasan kayu
    const thud = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(160, now + 0.12);
    thud.frequency.exponentialRampToValueAtTime(48, now + 0.28);
    thudGain.gain.setValueAtTime(0.28, now + 0.12);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    thud.connect(thudGain);
    thudGain.connect(ctx.destination);
    thud.start(now + 0.12);
    thud.stop(now + 0.31);
  } catch (err) {
    // Abaikan jika browser memblokir audio otomatis
  }
}

// Efek Suara Klik Kayu Lembut saat Membuka/Menutup Kartu Materi Belajar
function playWoodClickSound(isOpening = true) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isOpening ? 340 : 280, now);
    osc.frequency.exponentialRampToValueAtTime(isOpening ? 520 : 190, now + 0.065);

    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  } catch (err) {
    // Abaikan jika browser memblokir audio otomatis
  }
}

function animateScreenEntry() {
  screenEl.classList.remove('screen-enter');
  void screenEl.offsetWidth;
  screenEl.classList.add('screen-enter');
}

function clearCutTimers() {
  clearTimeout(chopTimeout);
  clearInterval(batchInterval);
  State.isChopping = false;
  State.batchCutRunning = false;
}

function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-16 sm:bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full font-bold text-xs sm:text-sm border-2 border-white shadow-xl transition-opacity duration-300 opacity-100 text-center max-w-[92vw] ${
    type === 'warn' ? 'bg-amber-600 text-white' : type === 'err' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'
  }`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2600);
}

  const info = BEAN_CATEGORIES[sample.type];
  const isAlreadyCut = sample.cut && !isChopping;

  // Bagian biji di dalam dudukan guillotine (Utuh / Sedang Terbelah / Sudah Terbelah)
  let beanInSlotSVG = '';
  if (!sample.cut && !isChopping) {
    // Biji kakao utuh berada di dalam slot dudukan guillotine
    beanInSlotSVG = `
      <g>
        <ellipse cx="200" cy="144" rx="52" ry="27" fill="#693b20" stroke="#261004" stroke-width="3"/>
        <path d="M158,140 Q200,127 242,140 M162,152 Q200,163 238,152" stroke="#42210e" stroke-width="2.2" fill="none"/>

      </g>
    `;
  } else {
    // Dua belahan keping biji (kotiledon) membuka di dalam dudukan guillotine
    const leftGroupClass = isChopping ? 'half-left-anim' : '';
    const rightGroupClass = isChopping ? 'half-right-anim' : '';
    const leftTransform = isAlreadyCut ? 'transform="translate(-20, 0) rotate(-6 185 154)"' : '';
    const rightTransform = isAlreadyCut ? 'transform="translate(20, 0) rotate(6 215 154)"' : '';

    beanInSlotSVG = `
      <g>

                stroke="${info.fissureColor}" stroke-width="${info.fissureWidth}" fill="none" stroke-linecap="round"/>

            <circle cx="158" cy="138" r="5.5" fill="#f1f5f9" opacity="0.92"/>

// LOGIKA PENENTUAN HASIL FERMENTASI (5 SAMPEL BIJI)
// ============================================================================
function computeCutTestSamples() {
  const { day, temp, turnsDone, totalTurns } = State;
  const turnedDay2 = turnsDone.includes(2);
  const turnedDay4 = turnsDone.includes(4);

  if (totalTurns >= 4) {
    return ['moldy', 'moldy', 'moldy', 'partly', 'brown'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (totalTurns === 0 && day >= 4) {
    return ['slaty', 'slaty', 'slaty', 'purple', 'partly'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (day <= 3 || temp < 38) {
    return ['purple', 'purple', 'purple', 'slaty', 'partly'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (day === 6 && turnedDay2 && turnedDay4 && temp >= 45 && temp <= 50) {
    return ['brown', 'brown', 'brown', 'brown', 'brown'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  return ['partly', 'partly', 'brown', 'brown', 'purple'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
}

// 3. SIMULASI KOTAK FERMENTASI 6 HARI (100% KONTROL MANUAL PENGGUNA)
// ============================================================================
function startFermentationStage() {
  clearCutTimers();
  State.day = 1;
  State.temp = 28;
  State.tempHistory = [28];
  State.ph = 5.6;
  State.pulpLevel = 100;
  State.turnsDone = [];
  State.totalTurns = 0;
  State.leafClosed = true;

  renderFermentationStage(true);
}

function advanceDay() {
  if (State.day >= 6) return;

  if ((State.day === 2 || State.day === 4) && !State.turnsDone.includes(State.day)) {
    showToast(`⚠️ Kamu melewatkan pembalikan Hari ke-${State.day}! Aerasi oksigen & suhu menjadi kurang optimal.`, 'warn');
  }

  State.day++;

  if (State.day === 2) {
    State.temp = State.leafClosed ? 42 : 36;
    State.ph = 4.9;
    State.pulpLevel = 72;
  } else if (State.day === 3) {
    State.temp = State.turnsDone.includes(2) ? (State.leafClosed ? 48 : 42) : 34;
    State.ph = 4.4;
    State.pulpLevel = 45;
  } else if (State.day === 4) {
    State.temp = State.turnsDone.includes(2) ? (State.leafClosed ? 47 : 41) : 33;
    State.ph = 4.3;
    State.pulpLevel = 25;
  } else if (State.day >= 5) {
    State.ph = State.day === 5 ? 4.6 : 4.9;
    State.pulpLevel = State.day === 5 ? 12 : 5;
    if (State.turnsDone.includes(2) && State.turnsDone.includes(4)) {
      State.temp = State.leafClosed ? 48 : 43;
    } else if (State.turnsDone.length > 0) {
      State.temp = State.leafClosed ? 41 : 36;
    } else {
      State.temp = 31;
    }
  }

  State.tempHistory.push(State.temp);

  if (State.day === 6) {
    showToast('🏁 Fermentasi mencapai Hari ke-6! Silakan tekan tombol "Lanjut ke Uji Belah Biji (Cut Test)" jika sudah siap.');
  } else {
    showToast(`📅 Memasuki Hari ke-${State.day}. Pilih tindakan hari ini sebelum menekan "Lanjut Hari ke-${State.day + 1}".`);
  }

  renderFermentationStage(false);
}

function svgMiniTempGraph() {
  const pts = State.tempHistory.map((t, idx) => {
    const x = 22 + idx * 42;
    const y = 62 - ((t - 25) / 30) * 48;
    return `${x},${Math.max(8, Math.min(62, y))}`;
  }).join(' ');

  return `<svg viewBox="0 0 260 72" class="w-full h-16 bg-black/35 rounded-xl border border-amber-900/50 p-1 shadow-inner">
    <rect x="18" y="14" width="225" height="10" fill="#10b981" opacity="0.24"/>
    <text x="240" y="22" text-anchor="end" font-size="8" fill="#6ee7b7" font-weight="bold">45–50°C</text>
    <polyline fill="none" stroke="#facc15" stroke-width="2.5" points="${pts}"/>
    ${State.tempHistory.map((t, idx) => {
      const x = 22 + idx * 42;
      const y = Math.max(8, Math.min(62, 62 - ((t - 25) / 30) * 48));
      return `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" stroke="#b45309" stroke-width="1.5"/>`;
    }).join('')}
  </svg>`;
}

  let timelineHTML = '';

    const isCurrent = d === State.day;

    timelineHTML += `
      <div class="card-lift flex flex-col items-center p-1.5 rounded-xl border-2 text-center ${

          turned ? 'bg-emerald-600 text-white' : ideal ? 'bg-amber-600 text-white' : 'bg-stone-700 text-stone-200'
        }">${turned ? 'Dibalik' : ideal ? 'Jadwal Balik' : 'Diamkan'}</span>
      </div>
    `;
  }

  const isAnaerobPhase = State.day <= 2;
  const isIdealTemp = State.temp >= 45 && State.temp <= 50;
  const isTurnScheduleDay = State.day === 2 || State.day === 4;
  const alreadyTurnedToday = State.turnsDone.includes(State.day);

  screenEl.innerHTML = `
    <header class="flex flex-wrap justify-between items-center gap-2">

      showToast(`✅ Pembalikan Hari ke-${State.day} tepat! Oksigen masuk & suhu naik ideal ke ${State.temp}°C.`);

      State.temp = Math.max(36, State.temp - 3);
      showToast(`⚠️ Hari ke-${State.day} bukan jadwal utama pembalikan! Suhu turun ke ${State.temp}°C.`, 'warn');

  };

    State.temp = State.leafClosed ? Math.min(52, State.temp + 3) : Math.max(30, State.temp - 3);
    State.tempHistory[State.tempHistory.length - 1] = State.temp;
    showToast(State.leafClosed ? '🍃 Daun pisang ditutup rapat untuk menjaga panas.' : '💨 Daun dibuka sedikit untuk melepas panas.');

    State.selectedSampleIdx = 0;

function getHintMessage() {
  if (State.totalTurns >= 4) return '⚠️ Peringatan: Terlalu sering membuka & membalik biji memicu kontaminasi jamur!';
  if (State.day === 1) return 'Hari 1 (Fase Anaerob): Khamir memecah gula pulp menjadi alkohol & CO₂. Biarkan tertutup, lalu tekan "Lanjut Hari ke-2".';
  if (State.day === 2) return State.turnsDone.includes(2)
    ? 'Bagus! Pembalikan pertama (Hari ke-2) selesai. Tekan "Lanjut Hari ke-3" untuk masuk ke Fase Aerob.'
    : '⭐ Jadwal Pembalikan Pertama! Klik "Balik / Aduk Biji" dulu sebelum menekan "Lanjut Hari ke-3".';
  if (State.day === 3) return 'Hari 3 (Fase Aerob): Bakteri Acetobacter menghasilkan panas puncak (45–50°C) & menurunkan pH.';
  if (State.day === 4) return State.turnsDone.includes(4)
    ? 'Mantap! Pembalikan kedua (Hari ke-4) selesai. Tekan "Lanjut Hari ke-5" untuk melanjutkan.'
    : '⭐ Jadwal Pembalikan Kedua! Klik "Balik / Aduk Biji" dulu sebelum menekan "Lanjut Hari ke-5".';
  if (State.day === 5) return 'Hari 5: Lendir pulp hampir habis & reaksi enzimatis berlangsung. Tekan "Lanjut Hari ke-6".';
  return 'Hari 6: Fermentasi selesai! Tekan "Lanjut ke Uji Belah Biji (Cut Test)" untuk memeriksa keping biji.';
}

// ============================================================================
// 4. LABORATORIUM BELAHAN BIJI VIRTUAL DENGAN ALAT PISAU GUILLOTINE
// ============================================================================
function executeGuillotineCut(idx, onComplete = null) {
  if (State.isChopping) return;
  const targetSample = State.samples[idx];
  if (!targetSample) return;

  State.selectedSampleIdx = idx;
  State.samples.forEach(s => { s.justCut = false; });

  // Jika biji sudah pernah dibelah, cukup tampilkan di dudukan guillotine
  if (targetSample.cut) {
    renderCutTestStage(false);
    if (onComplete) onComplete();
    return;
  }

  // Jalankan animasi pisau guillotine turun membelah biji
  State.isChopping = true;
  targetSample.cut = true;
  targetSample.justCut = true;
  State.cutCount++;

  playGuillotineSound();
  renderCutTestStage(false);

  chopTimeout = setTimeout(() => {
    State.isChopping = false;
    renderCutTestStage(false);
    if (onComplete) onComplete();
  }, 680);
}

      <div class="lg:col-span-5 wood-panel p-4 flex flex-col justify-between space-y-3">
        <div>
          <div class="flex justify-between items-center border-b border-amber-700/50 pb-2 mb-2">
            <span class="font-extrabold text-yellow-300 text-sm">🧠 Kuis Refleksi Projek IPAS</span>
            <span class="text-xs bg-black/40 px-2.5 py-0.5 rounded-full text-amber-200 font-bold">
              Soal ${State.quizIdx + 1} / ${QUIZ_QUESTIONS.length}
            </span>
          </div>

          <p class="text-xs sm:text-sm font-bold text-white leading-relaxed mb-3">
            ${currentQuiz.q}
          </p>

          <div class="space-y-2" id="quiz-choices">
            ${currentQuiz.opts.map((optText, i) => `
              <button data-qopt="${i}" class="card-lift w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 transition-all bg-[#fff8eb] text-[#3b1e08] border-amber-900 hover:bg-amber-100 shadow-sm">
                ${String.fromCharCode(65 + i)}. ${optText}
              </button>
            `).join('')}
          </div>

          <div id="quiz-feedback" class="hidden mt-3 p-2.5 rounded-xl text-xs leading-relaxed font-semibold bg-black/45 border border-amber-400/50 text-amber-100"></div>
        </div>

        <div class="pt-2 border-t border-amber-700/50 flex flex-wrap gap-2 justify-between">
          <button id="btn-gal-sim" class="btn-3d btn-green px-4 py-2 text-xs sm:text-sm flex-1">
            🔄 Main Simulasi Lagi
          </button>
          <button id="btn-next-quiz" class="btn-3d btn-gold px-4 py-2 text-xs sm:text-sm hidden">
            Soal Berikutnya ▶
          </button>
        </div>
      </div>
    </section>
  `;

  if (withTransition) animateScreenEntry();
  document.getElementById('btn-gal-home').onclick = renderMenu;
  document.getElementById('btn-gal-study').onclick = () => renderStudyModule(1);
  document.getElementById('btn-gal-sim').onclick = startFermentationStage;

  document.querySelectorAll('[data-gal]').forEach(el => {
    el.onclick = () => renderGalleryAndQuiz(el.dataset.gal, false);
  });

  document.querySelectorAll('[data-qopt]').forEach(btn => {
    btn.onclick = () => {
      if (State.quizAnswered) return;
      State.quizAnswered = true;
      const chosen = Number(btn.dataset.qopt);
      const isRight = chosen === currentQuiz.ans;

      document.querySelectorAll('[data-qopt]').forEach((b, idx) => {
        if (idx === currentQuiz.ans) {
          b.className = 'w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 bg-emerald-600 text-white border-emerald-900 shadow-md';
        } else if (idx === chosen && !isRight) {
          b.className = 'w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 bg-red-600 text-white border-red-900 shadow-md';
        }
      });

      const fb = document.getElementById('quiz-feedback');
      fb.classList.remove('hidden');
      if (isRight) {
        State.quizScore += 30;
        fb.innerHTML = `✅ <b>Benar (+30 Poin)!</b> ${currentQuiz.exp}`;
        showToast('🎉 Jawaban Tepat! +30 Poin');
      } else {
        fb.innerHTML = `💡 <b>Kurang Tepat.</b> ${currentQuiz.exp}`;
        showToast('Perhatikan penjelasan ilmiah di kotak kuis!', 'warn');
      }

      const nextQBtn = document.getElementById('btn-next-quiz');
      if (State.quizIdx < QUIZ_QUESTIONS.length - 1) {
        nextQBtn.classList.remove('hidden');
        nextQBtn.onclick = () => {
          State.quizIdx++;
          State.quizAnswered = false;
          renderGalleryAndQuiz(State.gallerySelected, false);
        };
      } else {
        nextQBtn.classList.remove('hidden');
        nextQBtn.textContent = '🏆 Selesai Kuis';
        nextQBtn.onclick = () => {
          State.totalScore += State.quizScore;
          State.quizScore = 0;
          showToast(`🏆 Kuis selesai! Total skormu sekarang: ${State.totalScore} Poin!`);
          renderGalleryAndQuiz(State.gallerySelected, false);
        };
      }
    };
  });
}

// Inisialisasi aplikasi saat halaman dimuat
renderMenu();
</script>
</body>
</html>
